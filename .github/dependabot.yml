version: 2

updates:
  - package-ecosystem: "npm"
    # The workspace root only. For a pnpm workspace the root entry reads `pnpm-workspace.yaml` and updates every package's manifest and the one `pnpm-lock.yaml` together, and Dependabot refuses (`misconfigured_tooling`) to update from a package directory whose lock file and workspace file are both in a parent directory, so listing `/packages/*` as well made those jobs fail and opened a duplicate pull request per package for the same bump.
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # The Rust workspace's lock file and its toolchain pin, with the same release-age cooldown the npm entry uses. The cargo-deny version the workflows install is outside both ecosystems, and scripts/check-tool-pins.py checks it against the same cooldown on a schedule.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "rust-toolchain"
    directory: "/rust"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"

  # The npm entry above never covers the actions themselves, so every `uses:` in the workflows -- checkout, setup-node, pnpm/action-setup, cache, attest -- would be pinned to a major and then left to drift, including the ones that hold `id-token: write` and sign release attestations. `/` covers the workflow files; `/.github/actions/*` covers the composite action's own `uses:` steps, which live in a separate manifest Dependabot does not reach from the root.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      # Weekly rather than the npm entry's daily: action releases are far less frequent, and a daily poll would only add noise.
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      # `ci` rather than the npm entry's `build`: these updates change the CI definition, and commitlint accepts both types. The scope Dependabot appends makes it `ci(deps)`.
      prefix: "ci"
      include: "scope"
    groups:
      # One catch-all group, majors included. Unlike an npm major, an action major bump is a one-line change that either passes CI or does not, so there is nothing gained by isolating it into its own pull request.
      actions:
        patterns: ["*"]
