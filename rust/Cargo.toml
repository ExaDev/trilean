[workspace]
resolver = "2"
members = [
    "bindings/trilean-regex-wasm",
    "crates/json-shape",
    "crates/json-shape-derive",
    "crates/trilean-regex",
    "tests/compile-fail",
    "tests/trilean-conformance",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/ExaDev/trilean"

[workspace.dependencies]
json-shape = { path = "crates/json-shape" }
json-shape-derive = { path = "crates/json-shape-derive" }
# Without its default features, which pull in the futures crates the binding does not use.
js-sys = { version = "0.3.107", default-features = false }
proc-macro2 = "1"
quote = "1"
serde = "1"
# `float_roundtrip` makes a number literal read as the nearest double, as `JSON.parse` reads it. serde_json's default parser can be one unit in the last place away, so a validator would disagree with a JavaScript reader (and with a JSON Schema validator in JavaScript) at a numeric bound. `raw_value` lets `Value`'s `Serialize` write a number as the text `JSON.stringify` writes, which serde_json's own float writer does not for every double.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
trilean-regex = { path = "crates/trilean-regex" }
wasm-bindgen = "0.2.130"
# The lock holds the newest release old enough for the install policy's release-age rule, and moves up by the same rule.
syn = { version = "3", default-features = false, features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"] }

[workspace.lints.rust]
# `compile_fail` is set by the check of tests/compile-fail, one case name at a time.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(compile_fail, values(any()))'] }
# Binding crates that need wasm-bindgen's generated FFI relax this in their own manifest, not here.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
