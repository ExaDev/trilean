# Which workspace crates may depend on which third-party crates, enforced beside the allowlist in deny.toml.
#
# cargo-deny rejects a crate that is both allowed and denied, and a crate absent from an allowlist fails even when
# its only dependants are wrappers, so the wrapper rules cannot share a file with the allowlist. CI runs
# `cargo deny --config deny-boundaries.toml check bans` as a second pass, and this file has no allowlist of its own.

[bans]
multiple-versions = "allow"

# wasm-bindgen and its companions compile only for the wasm targets, so the library crates every other consumer
# uses must never depend on them. `wrappers` lets exactly the binding crates through, and denies any other
# dependant, a transitive one included.
deny = [
    { crate = "wasm-bindgen", wrappers = ["trilean-regex-wasm", "trilean-wasm", "trilean-sql-wasm", "js-sys", "wasm-bindgen-futures"], reason = "Only the binding crates cross into JavaScript." },
    { crate = "js-sys", wrappers = ["trilean-regex-wasm", "trilean-wasm", "trilean-sql-wasm", "wasm-bindgen-futures"], reason = "Only the binding crates call JavaScript built-ins." },
    { crate = "wasm-bindgen-futures", wrappers = ["trilean-regex-wasm", "trilean-wasm", "trilean-sql-wasm"], reason = "Only the binding crates await JavaScript promises." },
]
