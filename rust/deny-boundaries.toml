# Which workspace crate may use which third-party crate. cargo-deny cannot hold these `wrappers` rules and the
# allowlist of deny.toml in one file, so this is a second pass over the same workspace, run as
# `sh scripts/rust.sh deny-bans <absolute path of rust/Cargo.toml> <absolute path of this file>`. A listed crate is
# refused unless every crate that depends on it directly is one of its wrappers.

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

deny = [
    # The derives are the only place a type declaration is parsed and code is written, so no other crate gets a parser
    # or a code generator in its graph by accident.
    { crate = "syn", wrappers = ["json-shape-derive", "serde_derive", "wasm-bindgen-macro-support"], reason = "Only the derive macros parse Rust syntax; serde_derive is a dev-dependency of json-shape, for a test, and wasm-bindgen-macro-support is the macro crate wasm-bindgen is written with, which a binding crate alone may use." },
    { crate = "quote", wrappers = ["json-shape-derive", "serde_derive", "syn", "wasm-bindgen-macro", "wasm-bindgen-macro-support"], reason = "Only the derive macros generate code; syn's printing feature uses it." },
    { crate = "proc-macro2", wrappers = ["json-shape-derive", "quote", "serde_derive", "syn", "wasm-bindgen-macro-support"], reason = "The token types of the derive macros and the crates they are written with." },
    # The libraries that cross the boundary to JavaScript belong in a binding crate, never in a crate that carries logic, which builds and tests natively without a wasm toolchain.
    { crate = "wasm-bindgen", wrappers = ["js-sys", "trilean-regex-wasm"], reason = "The glue to JavaScript belongs in a binding crate, never in a crate that carries logic." },
    { crate = "js-sys", wrappers = ["trilean-regex-wasm"], reason = "JavaScript's built-in objects belong in a binding crate, never in a crate that carries logic." },
]
