[package]
name = "corpus-format-wasm"
description = "The wasm binding of corpus-format: the same format rules in Node, Bun, Deno, browsers and Workers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
corpus-format.workspace = true
js-sys.workspace = true
json-shape.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[features]
# What only the tests of the binding call. The package is built without it, and `cargo xtask npm corpus-format --test-hooks` builds the copy the tests load.
test-hooks = []

[lints]
workspace = true
