# The allowlist `cargo deny check` enforces in CI. A crate that is not listed under [bans] allow fails the build,
# so adding a dependency is a reviewed change to this file, with the reason it is needed. The workspace's own
# crates are listed too, since cargo-deny applies the allowlist to every crate in the graph.
#
# The deliberate limit is to std, serde and serde_json for the library crates. The binding crates, which compile
# to wasm, are the only ones allowed to depend on wasm-bindgen and its companions: cargo-deny cannot express that
# in this file, since a crate it allows cannot also be denied with `wrappers`, so deny-boundaries.toml states it and
# CI runs both files.

[graph]
all-features = true

[advisories]
# A published advisory against any crate in the graph fails the check. There is no ignore list: an advisory is
# fixed by updating or replacing the crate, or recorded here with its id and a reason.
ignore = []

[licenses]
# Only permissive licences, so nothing in the graph restricts how the crates are redistributed.
allow = [
    # The licence of the workspace's own crates and of most of the crates below.
    "MIT",
    # The other half of the dual licence most Rust crates carry.
    "Apache-2.0",
    # unicode-ident, which proc-macro2 and syn depend on, ships its Unicode data under this licence.
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
# A workspace crate depends on a sibling by path, which the wildcard check would otherwise reject.
wildcards = "deny"
allow-wildcard-paths = true

# Every crate in the graph, with the reason it is there. Anything absent fails.
allow = [
    # The workspace's own crates are subject to the allowlist too.
    { crate = "trilean-conformance", reason = "Loads and checks the conformance corpus." },
    { crate = "serde", reason = "Serialisation traits for the data types the crates exchange." },
    { crate = "serde_core", reason = "The trait definitions serde re-exports, split out of serde itself." },
    { crate = "serde_derive", reason = "Derives Serialize and Deserialize for the tree and value types." },
    { crate = "serde_json", reason = "Reads and writes JSON, the format of trees, values, schemas and the conformance corpus." },
    { crate = "itoa", reason = "serde_json formats integers with it." },
    { crate = "memchr", reason = "serde_json scans strings with it." },
    { crate = "zmij", reason = "serde_json formats floating point numbers with it." },
    { crate = "proc-macro2", reason = "The token types serde_derive and the Shape derive are written against." },
    { crate = "quote", reason = "Builds the code serde_derive and the Shape derive generate." },
    { crate = "syn", reason = "Parses the item serde_derive and the Shape derive are applied to." },
    { crate = "unicode-ident", reason = "proc-macro2 checks identifiers against it." },
    { crate = "wasm-bindgen", reason = "The JavaScript boundary of the wasm builds; only binding crates may depend on it, see deny-boundaries.toml." },
    { crate = "js-sys", reason = "Calls JavaScript built-ins (RegExp, Reflect) from the binding crates." },
    { crate = "wasm-bindgen-futures", reason = "Awaits JavaScript promises from the async resolvers in the binding crates." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
